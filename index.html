const DATA={"password":"Success2026","siteUrl":"https://bishmalovich-web.github.io/bio4pack-Laminates/","logoUrl":"bio4pack-logo-v2.png","qrUrl":"qr-code-v2.png","profiles":{"821M":{"laminate":"821M","totalThickness":79,"widthAsked":750,"printing":"Printed","colors":"3-4","designs":1,"inputMode":"By Imp","inputQuantity":475000,"inputUnit":"IMP","impWidth":70,"impLength":105,"lengthMeters":4987.5,"convertedMeters":4655,"totalKg":397.50378125,"kgMoq":500,"baseSellKg":17.02460636532665,"baseSellMeter":1.356861233987,"baseSellImp":0.014247042956863501,"b4p":135.6861233987,"kgPerMeter":0.08539286385606874,"noPrintSellKg":14.47323007834502},"618":{"laminate":"618","totalThickness":61,"widthAsked":385,"printing":"Printed","colors":"5-8","designs":1,"inputMode":"By Length","inputQuantity":32000,"inputUnit":"m","impWidth":0,"impLength":0,"lengthMeters":32000,"convertedMeters":32000,"totalKg":988.9984,"kgMoq":500,"baseSellKg":14.38129514195295,"baseSellMeter":0.44447118391622625,"baseSellImp":null,"b4p":444.47118391622627,"kgPerMeter":0.030906199999999998,"noPrintSellKg":12.226056153520759},"618 W":{"laminate":"618 W","totalThickness":61,"widthAsked":760,"printing":"Printed","colors":"3-4","designs":1,"inputMode":"By Weight","inputQuantity":1000,"inputUnit":"Kg","impWidth":0,"impLength":0,"lengthMeters":16391.76820227607,"convertedMeters":16391.76820227607,"totalKg":1000,"kgMoq":500,"baseSellKg":18.394239052100335,"baseSellMeter":1.122147331143261,"baseSellImp":null,"b4p":1122.147331143261,"kgPerMeter":0.06100623115577888,"noPrintSellKg":15.637604077550673},"428":{"laminate":"428","totalThickness":79,"widthAsked":800,"printing":"Printed","colors":"3-4","designs":8,"inputMode":"By Length","inputQuantity":14000,"inputUnit":"m","impWidth":0,"impLength":0,"lengthMeters":14000,"convertedMeters":14000,"totalKg":1143.144,"kgMoq":500,"baseSellKg":19.35426384448092,"baseSellMeter":1.5803364705882355,"baseSellImp":null,"b4p":1580.3364705882354,"kgPerMeter":0.08165314285714285,"noPrintS function n(v,d=2){return v==null||v===''||Number.isNaN(Number(v))?'-':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}function unitFor(c){return c.inputMode==='By Weight'?'Kg':(c.inputMode==='By Length'?'m':'IMP')}function opt(a,v){return a.map(x=>`<option value="${x}" ${String(x)===String(v)?'selected':''}>${x}</option>`).join('')}function field(l,t,v,o,id,disabled=false){return `<div class="field ${disabled?'disabled':''}"><label>${l}</label>${t==='select'?`<select id="${id}" ${disabled?'disabled':''}>${opt(o,v)}</select>`:`<input id="${id}" type="number" value="${v??''}" ${disabled?'disabled':''}>`}</div>`}function ro(l,v){return `<div class="field readonly"><label>${l}</label><div class="value">${v}</div></div>`}function colorFactor(cur,base){const r={'0':0.86,'1-2':0.94,'3-4':1,'5-8':1.08};return (r[cur]??1)/(r[base]??1)}
function calc(c){const p=DATA.profiles[c.laminate];const bw=+p.widthAsked||1,w=+c.widthAsked||bw,bt=+p.totalThickness||1,t=+c.totalThickness||bt;let kgpm=(+p.kgPerMeter||0)*(w/bw)*(t/bt);const qty=+c.inputQuantity||0;let meters=0,kg=0;if(c.inputMode==='By Weight'){kg=qty;meters=kg/Math.max(kgpm,.000001)}else if(c.inputMode==='By Imp'){const iw=+c.impWidth||0,il=+c.impLength||0;if(iw>0&&il>0&&w>0){meters=qty/(w/iw)*(il/1000)}else{const bq=+p.inputQuantity||qty||1;meters=(+p.convertedMeters||+p.lengthMeters||0)*(qty/bq)}kg=meters*kgpm}else{meters=qty;kg=meters*kgpm}let sellKg=0;if(c.printing==='Printed'){let factor=colorFactor(c.colors,p.colors);factor*=((1+((+c.designs||1)-1)*.012)/(1+((+p.designs||1)-1)*.012));sellKg=(+p.baseSellKg||0)*factor}else{sellKg=(+p.noPrintSellKg||+p.baseSellKg||0)}const extra=Math.max(0,Math.min(95,+c.additionalGrossProfit||0));sellKg=sellKg/(1-extra/100);const sellM=sellKg*kgpm;const sellImp=(c.inputMode==='By Imp'&&qty)?(sellKg*kg/qty):null,usd=1.16;let b4p=sellM*1000;return{meters,kg,sellKg,sellKgUsd:sellKg*usd,sellM,sellMUsd:sellM*usd,sellImp,sellImpUsd:sellImp===null?null:sellImp*usd,b4p,totalSell:sellKg*kg}}
function wire(id,fn){const e=document.getElementById(id);if(e)e.onchange=x=>{fn(x.target.value);render()}}function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginCard"><div class="loginLogo"><img src="${DATA.logoUrl}" alt="BIO4PACK logo"></div><h1>BIO4PACK Pricing Calculator</h1><p>Enter password to continue.</p><div class="pwdRow"><input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password"><button id="togglePwd" class="showBtn" type="button">Show</button></div><button id="loginBtn" class="unlock">Unlock Calculator</button><div class="err" id="loginError"></div></div></div>`;document.getElementById('loginBtn').onclick=tryLogin;document.getElementById('passwordInput').onkeydown=e=>{if(e.key==='Enter')tryLogin()};const toggle=document.getElementById('togglePwd');const doToggle=e=>{if(e){e.preventDefault();e.stopPropagation()}const p=document.getElementById('passwordInput');const show=p.type==='password';p.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';p.focus()};toggle.onclick=doToggle;toggle.ontouchend=doToggle;document.getElementById('passwordInput').focus()}function tryLogin(){if(document.getElementById('passwordInput').value===DATA.password){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else document.getElementById('loginError').textContent='Incorrect password'}function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>deferredPrompt=null)}else alert('Use browser menu: Add to Home Screen / Install App.')}

ce</div><div class="hero"><div class="k">Sell Price Per KG</div><div class="m">€${n(r.sellKg,2)}</div><div class="u">EUR / KG</div></div><div class="metrics"><div class="metric"><div class="l">KG USD</div><div class="v">$${n(r.sellKgUsd,2)}</div></div><div class="metric"><div class="l">Meter EUR</div><div class="v">€${n(r.sellM,4)}</div></div><div class="metric"><div class="l">Meter USD</div><div class="v">$${n(r.sellMUsd,4)}</div></div><div class="metric"><div class="l">IMP EUR</div><div class="v">${r.sellImp===null?'-':'€'+n(r.sellImp,5)}</div></div></div><div class="b4p"><div class="l">B4P per 1000 meter</div><div class="v">€${n(r.b4p,2)}</div></div></div></div></section>`}
function bindCalc(num){wire(`lam${num}`,v=>{states[num]=clone(DATA.profiles[v]);states[num].laminate=v});wire(`th${num}`,v=>states[num].totalThickness=+v);wire(`width${num}`,v=>states[num].widthAsked=+v);wire(`mode${num}`,v=>{states[num].inputMode=v;if(v!=='By Imp'){states[num].impWidth=0;states[num].impLength=0}});wire(`qty${num}`,v=>states[num].inputQuantity=+v);wire(`printing${num}`,v=>{states[num].printing=v;if(v==='Not Printed'){states[num].colors='0';states[num].designs=1}});wire(`colors${num}`,v=>states[num].colors=v);wire(`designs${num}`,v=>states[num].designs=+v);wire(`impw${num}`,v=>states[num].impWidth=+v);wire(`impl${num}`,v=>states[num].impLength=+v);wire(`extra${num}`,v=>states[num].additionalGrossProfit=+v)}
