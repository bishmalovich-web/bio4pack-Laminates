function n(v,d=2){return v==null||v===''||Number.isNaN(Number(v))?'-':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function i(v){return v==null||v===''||Number.isNaN(Number(v))?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:0})}
function unitFor(c){return c.inputMode==='By Weight'?'Kg':(c.inputMode==='By Length'?'m':'IMP')}
function opt(a,v){return a.map(x=>`<option value="${x}" ${String(x)===String(v)?'selected':''}>${x}</option>`).join('')}
function field(l,t,v,o,id,disabled=false){return `<div class="field ${disabled?'disabled':''}"><label>${l}</label>${t==='select'?`<select id="${id}" ${disabled?'disabled':''}>${opt(o,v)}</select>`:`<input id="${id}" type="number" value="${v??''}" ${disabled?'disabled':''}>`}</div>`}
function ro(l,v){return `<div class="field readonly"><label>${l}</label><div class="value">${v}</div></div>`}
function colorFactor(cur,base){const r={'0':0.86,'1-2':0.94,'3-4':1,'5-8':1.08};return (r[cur]??1)/(r[base]??1)}
function calc(c){const p=DATA.profiles[c.laminate];const bw=+p.widthAsked||1,w=+c.widthAsked||bw,bt=+p.totalThickness||1,t=+c.totalThickness||bt;let kgpm=(+p.kgPerMeter||0)*(w/bw)*(t/bt);const qty=+c.inputQuantity||0;let meters=0,kg=0;if(c.inputMode==='By Weight'){kg=qty;meters=kg/Math.max(kgpm,.000001)}else if(c.inputMode==='By Imp'){const iw=+c.impWidth||0, il=+c.impLength||0;if(iw>0&&il>0&&w>0){meters=qty/(w/iw)*(il/1000)}else{const bq=+p.inputQuantity||qty||1;meters=(+p.convertedMeters||+p.lengthMeters||0)*(qty/bq)}kg=meters*kgpm}else{meters=qty;kg=meters*kgpm}let printed=c.printing==='Printed';let factor=1;let sellKg=0;if(printed){factor*=colorFactor(c.colors,p.colors);factor*=((1+((+c.designs||1)-1)*.012)/(1+((+p.designs||1)-1)*.012));sellKg=(+p.baseSellKg||0)*factor}else{sellKg=(+p.noPrintSellKg||+p.baseSellKg||0)}const extra=Math.max(0,Math.min(95,+c.additionalGrossProfit||0));sellKg=sellKg/(1-extra/100);const sellM=sellKg*kgpm;const sellImp=(c.inputMode==='By Imp'&&qty)?(sellKg*kg/qty):null,usd=1.16;const b4p=(sellImp!==null&&(+c.impLength||0))?((1000/(+c.impLength))*sellImp*1000):sellM*1000;return{meters,kg,sellKg,sellKgUsd:sellKg*usd,sellM,sellMUsd:sellM*usd,sellImp,sellImpUsd:sellImp===null?null:sellImp*usd,b4p,totalSell:sellKg*kg}}
