function setText(id,val){let e=q(id); if(e)e.textContent=val}
function thicknessOptions(lam){return Object.keys(DATA.structures[lam]||{}).map(Number).sort((a,b)=>a-b)}
function updateOutputs(i){let c=states[i],r=calc(c);let title=q(`title${i}`); if(title)title.textContent=`Calculator ${i} - ${c.laminate}`; setText(`outMeters${i}`,fmt(r.meters,0)+' m');setText(`outKg${i}`,fmt(r.kg,2)+' kg');setText(`outTotal${i}`,'€'+fmt(r.totalSell,2));let moq=q(`moq${i}`);if(moq){moq.className='moq '+(r.kg>=c.kgMoq?'good':'bad');moq.textContent=`MOQ ${r.kg>=c.kgMoq?'OK':'UNDER'} ${fmt(r.kg,2)} kg / MOQ ${fmt(c.kgMoq,0)} kg`;}setText(`sellKg${i}`,'€'+fmt(r.sellKg,2));setText(`usdKg${i}`,'$'+fmt(r.usdKg,2));setText(`meterEur${i}`,'€'+fmt(r.sellM,4));setText(`meterUsd${i}`,'$'+fmt(r.usdM,4));setText(`impEur${i}`,r.sellImp==null?'-':'€'+fmt(r.sellImp,5));setText(`b4p${i}`,'€'+fmt(r.b4p,2));}
function inputBlock(label,id,manual,disabled=false){return `<div class="field ${manual?'manual':''} ${disabled?'disabled':''}"><label>${label}${manual?'<span class="tag">TYPE HERE</span>':''}</label><input id="${id}" inputmode="decimal" autocomplete="off" type="text" placeholder="Type value" ${disabled?'disabled':''}></div>`}
function selectBlock(label,id,arr,val,disabled=false){return `<div class="field ${disabled?'disabled':''}"><label>${label}</label><select id="${id}" ${disabled?'disabled':''}>${opt(arr,val)}</select></div>`}
function card(i){let c=states[i],isImp=c.inputMode==='By Imp',notP=c.printing==='Not Printed';return `<section class="calc calc${i}"><div class="calcTitle" id="title${i}">Calculator ${i} - ${c.laminate}</div><div class="body"><div class="section">Material setup</div><div class="grid">${selectBlock('🏷️ Laminate',`lam${i}`,laminates,c.laminate)}${selectBlock('📏 Total Thickness',`th${i}`,thicknessOptions(c.laminate),c.totalThickness)}${inputBlock('📐 Width of Reel',`width${i}`,true)}</div><div class="section">Production inputs</div><div class="grid">${selectBlock('⚙️ Input Mode',`mode${i}`,DATA.inputModes,c.inputMode)}${inputBlock(`🔢 Input Quantity (${c.inputMode==='By Weight'?'Kg':c.inputMode==='By Length'?'m':'IMP'})`,`qty${i}`,true)}${selectBlock('🖨️ Printing',`printing${i}`,DATA.printingOptions,c.printing)}${selectBlock('🎨 Colors',`colors${i}`,DATA.colors,notP?'0':c.colors,notP)}${selectBlock('🎨 Designs',`designs${i}`,DATA.designs,notP?1:c.designs,notP)}${inputBlock('📐 IMP Width',`impw${i}`,true,!isImp)}${inputBlock('📏 IMP Length',`impl${i}`,true,!isImp)}</div><div class="note">Shipping is already included internally as EXW EU. Supplier is fixed behind the scenes as Marma.</div><div class="section">Calculated output</div><div class="grid"><div class="field readonly"><label>📏 Calculated Length</label><div id="outMeters${i}" class="value"></div></div><div class="field readonly"><label>⚖️ Calculated KG</label><div id="outKg${i}" class="value"></div></div><div class="field readonly"><label>💰 Total Sell EUR</label><div id="outTotal${i}" class="value"></div></div></div><div class="status"><div class="moq" id="moq${i}"></div><div class="gp">📊 Additional Gross Profit % <input id="extra${i}" type="text" inputmode="decimal" placeholder="0"></div></div><div class="price"><div class="priceh">Final Price</div><div class="hero"><div class="k">💵 SELL PRICE PER KG</div><div id="sellKg${i}" class="m"></div><div>EUR / KG</div></div><div class="metrics"><div class="metric"><span>💵 KG USD</span><b id="usdKg${i}"></b></div><div class="metric"><span>💶 Meter EUR</span><b id="meterEur${i}"></b></div><div class="metric"><span>💵 Meter USD</span><b id="meterUsd${i}"></b></div><div class="metric"><span>💶 IMP EUR</span><b id="impEur${i}"></b></div></div><div class="b4p">🧮 B4P per 1000 meter<br><b id="b4p${i}"></b></div></div></div></section>`}
function bind(i){let c=states[i];for(let [id,k] of Object.entries({['width'+i]:'widthAsked',['qty'+i]:'inputQuantity',['impw'+i]:'impWidth',['impl'+i]:'impLength',['extra'+i]:'additionalGrossProfit'})){let e=q(id);if(e){e.value=c[k]||'';e.addEventListener('input',ev=>{c[k]=ev.target.value;updateOutputs(i)})}}q('lam'+i).onchange=e=>{let old=states[i];states[i]=fromLam(e.target.value);states[i].widthAsked=old.widthAsked;states[i].inputQuantity=old.inputQuantity;states[i].additionalGrossProfit=old.additionalGrossProfit;render()};q('th'+i).onchange=e=>{states[i].totalThickness=+e.target.value;updateOutputs(i)};q('mode'+i).onchange=e=>{states[i].inputMode=e.target.value;states[i].impWidth='';states[i].impLength='';render()};q('printing'+i).onchange=e=>{states[i].printing=e.target.value;if(states[i].printing==='Not Printed'){states[i].colors='0';states[i].designs=1}render()};let col=q('colors'+i); if(col)col.onchange=e=>{states[i].colors=e.target.value;updateOutputs(i)};let des=q('designs'+i); if(des)des.onchange=e=>{states[i].designs=+e.target.value;updateOutputs(i)};}
function login(){q('root').innerHTML=`<div class="login"><div class="card"><div class="logoBox"><img src="${DATA.logoUrl}" alt="BIO4PACK" onerror="this.onerror=null;this.src='./image.png';"></div><h1>BIO4PACK Laminates Pricing</h1><p class="subtitle">Confidential internal pricing workspace</p><div class="pwdRow"><input class="loginInput" id="pwd" type="password" placeholder="Password"><button class="showBtn" id="showPwd" type="button">Show</button></div><button class="unlockBtn" id="unlock">Unlock Calculator</button><div class="err" id="err"></div></div></div>`;const pwd=q('pwd'),show=q('showPwd');show.addEventListener('click',()=>{let sh=pwd.type==='password';pwd.type=sh?'text':'password';show.textContent=sh?'Hide':'Show';pwd.focus()});show.addEventListener('touchend',ev=>{ev.preventDefault();show.click();},{passive:false});const go=()=>{if(pwd.value===DATA.password){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else q('err').textContent='Incorrect password'};q('unlock').onclick=go;pwd.onkeydown=e=>{if(e.key==='Enter')go()};pwd.focus()}

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function updateInstallButton(){let b=q('installBtn');if(!b)return;b.style.display=isStandalone()?'none':'inline-flex'}
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;updateInstallButton();return}alert('To install: open the browser menu and choose Add to Home Screen / Install App.');}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;updateInstallButton()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;updateInstallButton()});

function render(){if(!auth)return login();let comp=shouldCompare();q('root').innerHTML=`<div class="app"><header class="top"><div class="topin"><div class="logoBox"><img src="${DATA.logoUrl}" alt="BIO4PACK" onerror="this.onerror=null;this.src='./image.png';"></div><div class="ttl"><h1>BIO4PACK Laminates Pricing</h1><div class="subtitle">Confidential internal pricing workspace</div></div><div class="headBtns"><button class="btn small" id="modeBtn">${light?'Dark Mode':'Bright Mode'}</button><button class="btn small" id="installBtn" type="button" style="display:none">📲 Install</button><button class="btn small" id="lockBtn">Lock</button><div class="qrbox"><img src="${DATA.qrUrl}" alt="QR" onerror="this.onerror=null;this.src='./qr-code.png';"><a class="btn primary" href="${DATA.siteUrl}" target="_blank">Open</a></div></div></div></header><main class="page"><section class="notice"><b>CONFIDENTIAL - INTERNAL USE ONLY</b><p>This application contains proprietary pricing methodologies, cost structures, commercial calculations, and business-sensitive information. Unauthorized sharing is strictly prohibited.</p></section><section class="toolbar"><div><h2>Calculator workspace</h2><div class="hint">Default view shows Calculator 1 only on portrait mobile. Use Compare or rotate the phone to landscape to show Calculator 2 side by side.</div></div><button class="btn primary" id="cmpBtn">${comp?'Hide Compare':'+ Compare'}</button></section><div class="calcGrid ${comp?'compareOn mobileCompare':''}">${card(1)}${card(2)}</div><section class="footer">CONFIDENTIAL - INTERNAL USE ONLY. Version: ${DATA.version}</section></main></div>`;q('cmpBtn').onclick=()=>{let currently=shouldCompare();if(currently){compareSuppressed=true;forceCompare=false}else{compareSuppressed=false;forceCompare=true}render()};q('modeBtn').onclick=()=>{light=!light;document.documentElement.classList.toggle('light',light);localStorage.setItem('b4p_theme',light?'light':'dark');render()};q('installBtn').onclick=installApp;updateInstallButton();q('lockBtn').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};bind(1);bind(2);updateOutputs(1);updateOutputs(2)}
window.addEventListener('resize',()=>{if(auth)render()});window.addEventListener('orientationchange',()=>{if(auth)setTimeout(render,160)});render();
</script></body></html>
