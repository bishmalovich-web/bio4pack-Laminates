function calcHtml(num){const c=states[num],r=calc(c),isImp=c.inputMode==='By Imp',notP=c.printing==='Not Printed',ths=DATA.structures[c.laminate].ths,under=r.kg<(c.kgMoq||500);return `<section class="calc calc${num}"><div class="calcTitle">Calculator ${num}</div><div class="wrap"><div class="group"><h3>Material setup</h3><div class="grid">${field('Laminate','select',c.laminate,laminates,`lam${num}`)}${field('Total Thickness','select',c.totalThickness,ths,`th${num}`)}${field('Width of Reel','number',c.widthAsked,null,`width${num}`)}</div></div><div class="group"><h3>Production inputs</h3><div class="grid">${field('Input Mode','select',c.inputMode,DATA.inputModes,`mode${num}`)}${field(`Input Quantity (${unitFor(c)})`,'number',c.inputQuantity,null,`qty${num}`)}${field('Printing','select',c.printing,DATA.printingOptions,`printing${num}`)}${field('Colors','select',notP?'0':c.colors,DATA.colors,`colors${num}`,notP)}${field('Designs','select',notP?1:c.designs,DATA.designs,`designs${num}`,notP)}${field('IMP Width','number',c.impWidth,null,`impw${num}`,!isImp)}${field('IMP Length','number',c.impLength,null,`impl${num}`,!isImp)}</div></div><div class="group"><h3>Calculated output</h3><div class="grid">${ro('Calculated Length',n(r.meters,0)+' m')}${ro('Calculated KG',n(r.kg,2)+' kg')}${ro('Total Sell EUR','€'+n(r.totalSell,2))}</div></div><div class="pricingNote"><strong>Pricing Basis</strong>V7 is anchored to the six active Excel laminate calculators. Other combinations use the workbook-visible layer and tier formula engine.</div><div class="status"><div class="moq ${under?'bad':'good'}"><span>${under?'UNDER MOQ':'MOQ OK'}</span><span>${n(r.kg,2)} kg / MOQ ${n(c.kgMoq||500,0)} kg</span></div><div class="gp"><span>Additional Gross Profit %</span><input id="extra${num}" type="number" value="${c.additionalGrossProfit??0}"></div></div><div class="priceBox"><div class="priceH">Final Price</div><div class="hero"><div class="k">Sell Price Per KG</div><div class="m">€${n(r.sellKg,2)}</div><div class="u">EUR / KG</div></div><div class="metrics"><div class="metric"><div class="l">KG USD</div><div class="v">$${n(r.usdKg,2)}</div></div><div class="metric"><div class="l">Meter EUR</div><div class="v">€${n(r.sellM,4)}</div></div><div class="metric"><div class="l">Meter USD</div><div class="v">$${n(r.usdM,4)}</div></div><div class="metric"><div class="l">IMP EUR</div><div class="v">${r.sellImp==null?'-':'€'+n(r.sellImp,5)}</div></div></div><div class="b4p"><div class="l">B4P per 1000 meter</div><div class="v">€${n(r.b4p,2)}</div></div></div></div></section>`}
function bindCalc(num){wire(`lam${num}`,v=>{states[num]=fromProfile(v)});wire(`th${num}`,v=>states[num].totalThickness=+v);wire(`width${num}`,v=>states[num].widthAsked=+v);wire(`mode${num}`,v=>{states[num].inputMode=v;if(v!=='By Imp'){states[num].impWidth=0;states[num].impLength=0}});wire(`qty${num}`,v=>states[num].inputQuantity=+v);wire(`printing${num}`,v=>{states[num].printing=v;if(v==='Not Printed'){states[num].colors='0';states[num].designs=1}});wire(`colors${num}`,v=>states[num].colors=v);wire(`designs${num}`,v=>states[num].designs=+v);wire(`impw${num}`,v=>states[num].impWidth=+v);wire(`impl${num}`,v=>states[num].impLength=+v);wire(`extra${num}`,v=>states[num].additionalGrossProfit=+v)}function render(){if(!auth){login();return}const canCompare=window.innerWidth>=720;if(!canCompare)compare=false;document.getElementById('root').innerHTML=`<div class="app ${mode==='light'?'light':'dark'}"><header class="top"><div class="topInner"><div class="brand"><div class="logo"><img src="${DATA.logoUrl}"></div><div><h1>BIO4PACK Laminates Pricing</h1><div class="sub">Confidential internal pricing workspace</div></div></div><div class="actions"><button class="btn" id="modeBtn">${mode==='dark'?'Bright Mode':'Dark Mode'}</button><button class="btn" id="logoutBtn">Lock</button><div class="pwaPanel"><img src="${DATA.qrUrl}"><div class="pwaButtons"><button id="installBtn">Install</button><a href="${DATA.siteUrl}" target="_blank">Open</a></div></div></div></div></header><main class="page"><section class="notice"><strong>CONFIDENTIAL - INTERNAL USE ONLY</strong><p>This application contains proprietary pricing methodologies, cost structures, commercial calculations, and business-sensitive information. Unauthorized sharing is strictly prohibited.</p></section><section class="toolbar"><div><h2>Calculator workspace</h2><p>Default view shows Calculator 1 only. Use +Compare to show Calculator 2 side by side.</p></div>${canCompare?`<button class="btn compare" id="compareBtn">${compare?'Hide Compare':'+ Compare'}</button>`:''}</section><div class="calcGrid ${compare&&canCompare?'compareOn':''}">${calcHtml(1)}${compare&&canCompare?calcHtml(2):''}</div><section class="footer">CONFIDENTIAL - INTERNAL USE ONLY. Version: ${DATA.version}</section></main></div>`;document.getElementById('modeBtn').onclick=()=>{mode=mode==='dark'?'light':'dark';localStorage.setItem('b4p_mode',mode);render()};document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;login()};const compareBtn=document.getElementById('compareBtn');if(compareBtn)compareBtn.onclick=()=>{compare=!compare;render()};document.getElementById('installBtn').onclick=installApp;bindCalc(1);if(compare&&canCompare)bindCalc(2)}render();
</script></body></html>
