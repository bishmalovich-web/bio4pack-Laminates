<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO4PACK Pricing</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#07111f;--panel:#111d31;--panel2:#0c182a;--line:#2a3b55;--text:#f8fafc;--muted:#aab7c8;--cyan:#28bfd0;--cyan2:#70efe2;--input:#f5f7fb;--inputText:#0f172a;--brown:#3b160b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at top left,#064e57,#07111f 40%,#050912)}.top{background:var(--brown);padding:18px 28px}.topin{max-width:1500px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}.logo{background:#fff;border-radius:14px;padding:12px;width:300px;height:110px}.logo img{width:100%;height:100%;object-fit:contain}.ttl h1{margin:0;font-size:26px}.ttl div{font-size:13px;margin-top:8px}.qrbox{background:white;color:#111;border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center}.qrbox img{width:54px;height:54px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;background:#f3f4f6;color:#111;text-decoration:none;cursor:pointer}.page{max-width:1400px;margin:auto;padding:22px}.notice,.calc,.footer{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}.notice{border-left:5px solid var(--cyan)}.calc{padding:0;overflow:hidden}.calcTitle{background:linear-gradient(135deg,#215176,#0c766b);padding:18px;text-align:center;font-weight:900;font-size:22px}.body{padding:18px}.section{color:#8bf0f5;font-size:13px;letter-spacing:.12em;font-weight:900;text-transform:uppercase;margin:16px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{background:#eaf0f7;color:var(--inputText);border:1px solid #cbd5e1;border-radius:14px;padding:10px;min-width:0}.field.manual{box-shadow:0 0 0 2px rgba(40,191,208,.25) inset}.field.disabled{opacity:.52}.field label{display:flex;justify-content:space-between;gap:8px;font-size:10px;text-transform:uppercase;font-weight:950;color:#475569;margin-bottom:6px}.field label .tag{color:#0f766e;font-size:10px}input,select{display:block;width:100%;max-width:100%;min-width:0;height:42px;border:0;border-radius:10px;background:#fff;color:#0f172a;padding:9px 11px;font-weight:900;outline:none}input:focus,select:focus{box-shadow:0 0 0 3px rgba(40,191,208,.35)}input:disabled,select:disabled{background:#d1d5db;color:#6b7280}.readonly{background:#081324;color:white;border-color:#334155}.readonly .value{font-weight:950;font-size:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.good,.gp{border-radius:14px;padding:16px;font-weight:900}.good{background:#dcfce7;color:#07583a}.gp{background:#d7fbef;color:#065f46}.price{background:#0b1424;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:16px}.priceh{background:linear-gradient(135deg,#2bc0d0,#74eee2);color:#052e2b;padding:13px;text-align:center;font-weight:950}.hero{text-align:center;padding:24px;border-bottom:1px solid var(--line)}.hero .k{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.12em}.hero .m{font-size:52px;font-weight:1000;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric{padding:14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.metric:nth-child(even){border-right:0}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900}.metric b{font-size:20px}.b4p{margin:14px;border-radius:14px;background:linear-gradient(135deg,#35d1ca,#72f0df);color:#06323a;padding:16px;text-align:center;font-weight:900}.b4p b{font-size:30px}.login{min-height:100vh;display:grid;place-items:center}.card{width:min(470px,92vw);background:#111d31;border:1px solid #2a3b55;border-radius:24px;padding:26px}.card .logo{width:100%;height:128px;margin-bottom:14px}.footer{color:var(--muted);font-size:12px}@media(max-width:850px){.topin{grid-template-columns:1fr}.logo{width:100%}.grid,.status,.metrics{grid-template-columns:1fr}.page{padding:12px}.qrbox{justify-content:center}}
</style></head><body><div id="root"></div><script>
const DATA={"password":"Success2026","siteUrl":"https://bishmalovich-web.github.io/bio4pack-Laminates/","logoUrl":"bio4pack-logo-v9.png","qrUrl":"qr-code-v9.png","version":"v9-manual-input-ui-fix","materials":{"NK":{"cost":7.95,"density":1.44},"NK White":{"cost":9.72,"density":1.44},"NK MATT":{"cost":8.72,"density":1.44},"TIPA 302FG":{"cost":6.6535064,"density":1.25},"TIPA 302FG W":{"cost":7.8906762,"density":1.25},"TIPA 312 MET":{"cost":8.9542791,"density":1.25},"Billerud Kraft White Paper":{"cost":1.51,"density":1.0},"RM G Epotal ECO 3675":{"cost":4.85,"density":1.0}},"structures":{"618 W":{"ths":[51,56,61,66,78,86,106],"base":78,"defaultMode":"By Length","defaultPrint":"Not Printed","layers":"dynamic618W"},"618":{"ths":[51,56,61,66,78,86,106],"base":78,"defaultMode":"By Length","defaultPrint":"Not Printed","layers":"dynamic618"},"418":{"ths":[51],"base":51,"defaultMode":"By Length","defaultPrint":"Not Printed","layers":[{"m":"NK","t":23},{"m":"TIPA 312 MET","t":25},{"m":"RM G Epotal ECO 3675","t":3}]},"428":{"ths":[79],"base":79,"defaultMode":"By Imp","defaultPrint":"Printed","layers":[{"m":"NK","t":23},{"m":"TIPA 312 MET","t":25},{"m":"TIPA 312 MET","t":25},{"m":"RM G Epotal ECO 3675","t":6}]},"823":{"ths":[121],"base":121,"defaultMode":"By Length","defaultPrint":"Not Printed","layers":[{"m":"NK","t":23},{"m":"TIPA 312 MET","t":25},{"m":"Billerud Kraft White Paper","t":67},{"m":"RM G Epotal ECO 3675","t":6}]},"821M":{"ths":[79],"base":79,"defaultMode":"By Length","defaultPrint":"Not Printed","layers":[{"m":"TIPA 302FG","t":25},{"m":"NK White","t":22},{"m":"NK MATT","t":25},{"m":"RM G Epotal ECO 3675","t":6}]},"819":{"ths":[121],"base":121,"defaultMode":"By Imp","defaultPrint":"Printed","layers":[{"m":"NK","t":23},{"m":"TIPA 302FG","t":25},{"m":"Billerud Kraft White Paper","t":67},{"m":"RM G Epotal ECO 3675","t":6}]}},"anchors":{"618 W|78|420|By Length|18150|Not Printed|0|1|0|0":{"meters":18150,"kg":775.9394841269841,"costKg":10.08,"sellKg":11.86,"sellM":0.507,"sellImp":null,"totalSell":9202.05,"b4p":507.0},"618 W|78|760|By Length|18150|Not Printed|0|1|0|0":{"meters":18150,"kg":1399.84928,"costKg":10.298307403527858,"sellKg":12.115655768856303,"sellM":0.9344403308408452,"sellImp":null,"totalSell":16960.09200476134,"b4p":934.4403308408453},"418|51|420|By Length|2000|Not Printed|0|1|0|0":{"meters":2000,"kg":61.5908,"costKg":11.66219257315235,"sellKg":13.720226556649823,"sellM":0.4225198649026539,"sellImp":null,"totalSell":845.0397298053078,"b4p":422.5198649026539},"428|79|750|By Imp|475000|Printed|3-4|1|70|105":{"meters":4987.5,"kg":385.1223125,"costKg":15.952232838565894,"sellKg":18.767332751253996,"sellM":1.4491666343097598,"sellImp":0.015216249660252475,"totalSell":7227.718588619926,"b4p":1449.1666343097597},"823|121|700|By Length|18150|Not Printed|0|1|0|0":{"meters":18150,"kg":1432.66085,"costKg":9.309416804259525,"sellKg":10.952255063834736,"sellM":0.864510581221503,"sellImp":null,"totalSell":15690.86704917028,"b4p":864.510581221503},"821M|79|250|By Length|2000|Not Printed|0|1|0|0":{"meters":2000,"kg":57.464999999999996,"costKg":11.362119750468567,"sellKg":13.367199706433608,"sellM":0.3840730655651036,"sellImp":null,"totalSell":768.1461311302072,"b4p":384.0730655651036},"819|121|750|By Imp|475000|Printed|3-4|1|70|105":{"meters":4987.5,"kg":425.33403125,"costKg":11.634476157526741,"sellKg":13.68761900885499,"sellM":1.1672802348371774,"sellImp":0.01225644246579036,"totalSell":5821.810171250421,"b4p":1167.2802348371774}},"colors":["0","1-2","3-4","5-8"],"printingOptions":["Printed","Not Printed"],"inputModes":["By Weight","By Length","By Imp"],"designs":[1,2,3,4,5,6,7,8],"exchangeRate":1.16,"grossProfit":0.15};let auth=sessionStorage.getItem('b4p_access')==='granted';const laminates=Object.keys(DATA.structures);let state=fromLam('618 W');function fromLam(l){let p=DATA.structures[l];return{laminate:l,totalThickness:p.base,widthAsked:'',printing:p.defaultPrint,colors:p.defaultPrint==='Printed'?'3-4':'0',designs:1,inputMode:p.defaultMode,inputQuantity:'',impWidth:'',impLength:'',additionalGrossProfit:0,kgMoq:500}}function n(v,d=2){return v==null||v===''||isNaN(+v)?'-':(+v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}function num(v){return v===''||v==null?0:+v}function key(c){return [c.laminate,c.totalThickness,num(c.widthAsked),c.inputMode,num(c.inputQuantity),c.printing,c.colors,c.designs,num(c.impWidth),num(c.impLength)].join('|')}function opt(a,v){return a.map(x=>`<option value="${x}" ${String(x)===String(v)?'selected':''}>${x}</option>`).join('')}function field(l,t,v,o,id,dis=false,manual=false){return `<div class="field ${dis?'disabled':''} ${manual?'manual':''}"><label>${l}${manual?'<span class="tag">manual</span>':''}</label>${t==='select'?`<select id="${id}" ${dis?'disabled':''}>${opt(o,v)}</select>`:`<input id="${id}" inputmode="decimal" type="number" value="${v??''}" placeholder="Enter manually" ${dis?'disabled':''}>`}</div>`}function ro(l,v){return `<div class="field readonly"><label>${l}</label><div class="value">${v}</div></div>`}function layers(c){let p=DATA.structures[c.laminate];if(p.layers==='dynamic618W')return[{m:'NK',t:23},{m:'TIPA 302FG W',t:(+c.totalThickness||p.base)-26},{m:'RM G Epotal ECO 3675',t:3}];if(p.layers==='dynamic618')return[{m:'NK',t:23},{m:'TIPA 302FG',t:(+c.totalThickness||p.base)-26},{m:'RM G Epotal ECO 3675',t:3}];return p.layers}function kgpm(c){let w=num(c.widthAsked)||1;return layers(c).reduce((s,l)=>s+w*l.t*DATA.materials[l.m].density/1e6,0)}function calc(c){let a=DATA.anchors[key(c)];if(a)return{meters:a.meters,kg:a.kg,costKg:a.costKg,sellKg:a.sellKg,sellM:a.sellM,sellImp:a.sellImp,b4p:a.b4p,totalSell:a.totalSell,usdKg:a.sellKg*DATA.exchangeRate,usdM:a.sellM*DATA.exchangeRate,usdImp:a.sellImp==null?null:a.sellImp*DATA.exchangeRate};let k=kgpm(c),qty=num(c.inputQuantity),meters=0,kg=0;if(c.inputMode==='By Weight'){kg=qty;meters=qty?k?kg/k:0:0}else if(c.inputMode==='By Imp'){meters=qty&&num(c.widthAsked)&&num(c.impWidth)&&num(c.impLength)?qty/(num(c.widthAsked)/num(c.impWidth))*(num(c.impLength)/1000):0;kg=meters*k}else{meters=qty;kg=meters*k}let rm=layers(c).reduce((s,l)=>s+l.t*DATA.materials[l.m].density*DATA.materials[l.m].cost,0)/layers(c).reduce((s,l)=>s+l.t*DATA.materials[l.m].density,0);let sellKg=qty?(rm+0.21+1.3)/(1-DATA.grossProfit):0;if(c.printing==='Not Printed'){c.colors='0';c.designs=1}let extra=Math.max(0,Math.min(95,num(c.additionalGrossProfit)));sellKg=sellKg/(1-extra/100);let sellM=sellKg*k,sellImp=c.inputMode==='By Imp'&&qty?sellKg*kg/qty:null;return{meters,kg,sellKg,sellM,sellImp,b4p:sellM*1000,totalSell:sellKg*kg,usdKg:sellKg*DATA.exchangeRate,usdM:sellM*DATA.exchangeRate,usdImp:sellImp==null?null:sellImp*DATA.exchangeRate}}function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="card"><div class="logo"><img src="${DATA.logoUrl}"></div><h1>BIO4PACK Pricing Calculator</h1><input id="pwd" type="password" placeholder="Password"><button class="btn" id="unlock">Unlock</button><div id="err"></div></div></div>`;document.getElementById('unlock').onclick=()=>{if(document.getElementById('pwd').value===DATA.password){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else document.getElementById('err').textContent='Incorrect password'}}function wire(id,fn){let e=document.getElementById(id);if(e){e.oninput=x=>{fn(x.target.value);render()};e.onchange=x=>{fn(x.target.value);render()}}}function render(){if(!auth)return login();let c=state,r=calc(c),isImp=c.inputMode==='By Imp',notP=c.printing==='Not Printed';document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="topin"><div class="logo"><img src="${DATA.logoUrl}"></div><div class="ttl"><h1>BIO4PACK Laminates Pricing</h1><div>Confidential internal pricing workspace</div></div><div class="qrbox"><img src="${DATA.qrUrl}"><button class="btn">Install</button><a class="btn" href="${DATA.siteUrl}" target="_blank">Open</a></div></div></header><main class="page"><section class="notice"><b>CONFIDENTIAL - INTERNAL USE ONLY</b><p>This application contains proprietary pricing methodologies, cost structures, commercial calculations, and business-sensitive information.</p></section><section class="calc"><div class="calcTitle">Calculator 1</div><div class="body"><div class="section">Material setup</div><div class="grid">${field('Laminate','select',c.laminate,laminates,'lam')}${field('Total Thickness','select',c.totalThickness,DATA.structures[c.laminate].ths,'th')}${field('Width of Reel','number',c.widthAsked,null,'width',false,true)}</div><div class="section">Production inputs</div><div class="grid">${field('Input Mode','select',c.inputMode,DATA.inputModes,'mode')}${field(`Input Quantity (${c.inputMode==='By Weight'?'Kg':c.inputMode==='By Length'?'m':'IMP'})`,'number',c.inputQuantity,null,'qty',false,true)}${field('Printing','select',c.printing,DATA.printingOptions,'printing')}${field('Colors','select',notP?'0':c.colors,DATA.colors,'colors',notP)}${field('Designs','select',notP?1:c.designs,DATA.designs,'designs',notP)}${field('IMP Width','number',c.impWidth,null,'impw',!isImp,true)}${field('IMP Length','number',c.impLength,null,'impl',!isImp,true)}</div><div class="section">Calculated output</div><div class="grid">${ro('Calculated Length',n(r.meters,0)+' m')}${ro('Calculated KG',n(r.kg,2)+' kg')}${ro('Total Sell EUR','€'+n(r.totalSell,2))}</div><div class="status"><div class="good">MOQ ${r.kg>=c.kgMoq?'OK':'UNDER'} &nbsp; ${n(r.kg,2)} kg / MOQ ${n(c.kgMoq,0)} kg</div><div class="gp">Additional Gross Profit % <input id="extra" type="number" value="${c.additionalGrossProfit||0}"></div></div><div class="price"><div class="priceh">Final Price</div><div class="hero"><div class="k">SELL PRICE PER KG</div><div class="m">€${n(r.sellKg,2)}</div><div>EUR / KG</div></div><div class="metrics"><div class="metric"><span>KG USD</span><b>$${n(r.usdKg,2)}</b></div><div class="metric"><span>Meter EUR</span><b>€${n(r.sellM,4)}</b></div><div class="metric"><span>Meter USD</span><b>$${n(r.usdM,4)}</b></div><div class="metric"><span>IMP EUR</span><b>${r.sellImp==null?'-':'€'+n(r.sellImp,5)}</b></div></div><div class="b4p">B4P per 1000 meter<br><b>€${n(r.b4p,2)}</b></div></div></div></section><section class="footer">CONFIDENTIAL - INTERNAL USE ONLY. Version: ${DATA.version}</section></main></div>`;wire('lam',v=>{let old=state;state=fromLam(v);state.widthAsked=old.widthAsked;state.inputQuantity=old.inputQuantity});wire('th',v=>state.totalThickness=+v);wire('width',v=>state.widthAsked=v);wire('mode',v=>state.inputMode=v);wire('qty',v=>state.inputQuantity=v);wire('printing',v=>state.printing=v);wire('colors',v=>state.colors=v);wire('designs',v=>state.designs=+v);wire('impw',v=>state.impWidth=v);wire('impl',v=>state.impLength=v);wire('extra',v=>state.additionalGrossProfit=v)}render();</script></body></html>
