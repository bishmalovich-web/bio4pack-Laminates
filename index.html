<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B4PACK Pricing</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#06101f;--panel:#111d31;--text:#f8fafc;--muted:#aab7c8;--line:#2a3b55;--cyan:#28bfd0;--cyan2:#70efe2;--input:#f1f5f9;--inputText:#0f172a}.light{--bg:#f8fafc;--panel:#fff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--input:#fff;--inputText:#0f172a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at top left,#16434a,var(--bg) 38%,#050912)}.app.light{background:linear-gradient(135deg,#f8fafc,#eaf6ff)}.top{background:linear-gradient(135deg,#21130e,#48200f);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:white}.brand{display:flex;gap:14px;align-items:center}.logo{background:white;border-radius:16px;padding:8px 12px}.logo img{height:54px;max-width:300px;display:block}h1{margin:0;font-size:clamp(24px,3vw,36px)}.sub{color:#cbd5e1;font-size:13px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;background:white;color:#261810;font-weight:900;cursor:pointer}.install{display:flex;gap:8px;align-items:center;background:#f8fafc;color:#0f172a;border-radius:14px;padding:6px 8px}.install img{width:50px;height:50px}.install button,.install a{border:0;border-radius:9px;padding:7px 10px;background:var(--cyan);color:#052e2b;font-weight:900;text-decoration:none;cursor:pointer}.install a{background:var(--cyan2)}.page{max-width:1340px;margin:auto;padding:22px}.notice,.cards,.main,.price,.footer{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #0004}.notice{padding:16px 20px;border-left:6px solid var(--cyan);margin-bottom:18px}.notice p{margin:4px 0 0;color:var(--muted);font-size:13px}.cards{padding:18px;margin-bottom:18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tab{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#052e2b;border:0}.tab span{font-size:11px;text-transform:uppercase;font-weight:900;opacity:.75}.tab strong{display:block;font-size:24px;margin-top:6px}.tab small{font-weight:800;opacity:.8}.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(360px,.8fr);gap:18px}.title{padding:16px;text-align:center;background:#1f4167;color:white;font-size:20px;font-weight:950}.app.light .title{background:#dbeafe;color:#0f172a}.wrap{padding:18px}.group{margin-bottom:18px}.group h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8be9ef;margin:0 0 10px}.app.light .group h3{color:#057d8a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{background:var(--input);color:var(--inputText);border:1px solid #cbd5e1;border-radius:14px;padding:10px}.field label{display:block;font-size:10px;text-transform:uppercase;font-weight:950;color:#475569;margin-bottom:5px}select,input{width:100%;border:0;background:white;color:#0f172a;border-radius:10px;padding:8px 9px;font-weight:900}.readonly{background:var(--bg);color:var(--text);border-color:var(--line)}.readonly .value{font-size:17px;font-weight:950}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}.moq,.gp{border-radius:16px;padding:14px 16px;font-weight:950;display:flex;justify-content:space-between;align-items:center;gap:12px}.good{background:#d9fbe8;color:#07583a}.bad{background:#fee2e2;color:#991b1b}.gp{background:#d7fbef;color:#065f46}.gp input{max-width:120px;border:1px solid #23b8a6;background:#ccfbf1}.price{position:sticky;top:18px;align-self:start;overflow:hidden}.priceH{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#06323a;padding:18px;text-align:center;font-weight:950}.hero{text-align:center;padding:24px;border-bottom:1px solid var(--line)}.hero .k{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:950;letter-spacing:.12em}.hero .m{font-size:clamp(42px,5vw,60px);font-weight:1000;letter-spacing:-.06em;margin:8px 0}.hero .u{color:#a7f3d0;font-weight:900}.app.light .hero .u{color:#0f766e}.metrics{display:grid;grid-template-columns:1fr 1fr}.metric{padding:16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.metric:nth-child(even){border-right:0}.metric .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:950}.metric .v{font-size:22px;font-weight:950;margin-top:5px}.b4p{margin:18px;border-radius:18px;background:linear-gradient(135deg,#35d1ca,#72f0df);color:#06323a;padding:18px;text-align:center}.b4p .v{font-size:34px;font-weight:1000}.footer{margin-top:18px;padding:14px 18px;color:var(--muted);font-size:12px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top left,#16434a,#06101f 45%,#050912)}.loginCard{width:min(480px,100%);background:#111d31;border:1px solid #2a3b55;border-radius:28px;padding:30px}.loginLogo{background:white;border-radius:18px;padding:12px;display:inline-block;margin-bottom:18px}.loginLogo img{height:58px;max-width:330px}.loginCard input{background:#273549;color:white;border:1px solid #64748b;margin:12px 0}.loginCard button{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));font-weight:950;color:#052e2b}.err{color:#fca5a5;font-weight:900;min-height:20px;margin-top:10px}@media(max-width:980px){.top{flex-direction:column;align-items:flex-start}.work{grid-template-columns:1fr}.price{position:static}.grid{grid-template-columns:repeat(2,1fr)}.status{grid-template-columns:1fr}}@media(max-width:640px){.page{padding:14px}.brand{flex-direction:column;align-items:flex-start}.tabs,.grid,.metrics{grid-template-columns:1fr}.install{width:100%}}
</style></head><body><div id="root"></div><script>const DATA={"password":"Success2026","siteUrl":"https://bishmalovich-web.github.io/bio4pack-Laminates/","qrUrl":"qr-code.png","profiles":{"618 W":{"laminate":"618 W","totalThickness":61,"widthAsked":760,"prNonPr":"Printed","colors":"3-4","designs":1,"shipment":"Europe to Europe","inputMode":"By Weight","inputQuantity":1000,"inputUnit":"Kg","impWidth":0,"impLength":0,"lengthMeters":16391.76820227607,"totalKg":1000,"kgMoq":500,"sellKgEur":18.394239052100335,"kgPerMeter":0.06100623115577888},"618":{"laminate":"618","totalThickness":61,"widthAsked":385,"prNonPr":"Printed","colors":"5-8","designs":1,"shipment":"Europe to Europe","inputMode":"By Length","inputQuantity":32000,"inputUnit":"m","impWidth":0,"impLength":0,"lengthMeters":32000,"totalKg":983.9984,"kgMoq":500,"sellKgEur":14.381295142,"kgPerMeter":0.030749949999999998},"821M":{"laminate":"821M","totalThickness":79,"widthAsked":750,"prNonPr":"Printed","colors":"3-4","designs":1,"shipment":"Europe to Europe","inputMode":"By Imp","inputQuantity":475000,"inputUnit":"IMP","impWidth":70,"impLength":105,"lengthMeters":4987.5,"totalKg":397.50378125,"kgMoq":500,"sellKgEur":17.028,"sellImpEur":0.014247042956863501,"kgPerMeter":0.07970000626566416},"819":{"laminate":"819","totalThickness":121,"widthAsked":760,"prNonPr":"Printed","colors":"3-4","designs":1,"shipment":"Europe to Europe","inputMode":"By Weight","inputQuantity":1000,"inputUnit":"Kg","impWidth":760,"impLength":110,"lengthMeters":11651,"totalKg":1000,"kgMoq":500,"sellKgEur":14.04,"kgPerMeter":0.08582954252853832},"823":{"laminate":"823","totalThickness":121,"widthAsked":760,"prNonPr":"Printed","colors":"3-4","designs":1,"shipment":"Europe to Europe","inputMode":"By Weight","inputQuantity":1000,"inputUnit":"Kg","impWidth":760,"impLength":110,"lengthMeters":11651,"totalKg":1000,"kgMoq":500,"sellKgEur":14.35,"kgPerMeter":0.08582954252853832},"428":{"laminate":"428","totalThickness":79,"widthAsked":800,"prNonPr":"Printed","colors":"3-4","designs":8,"shipment":"Europe to Europe","inputMode":"By Length","inputQuantity":14000,"inputUnit":"m","impWidth":0,"impLength":0,"lengthMeters":14000,"totalKg":1143.144,"kgMoq":500,"sellKgEur":19.35426384448092,"kgPerMeter":0.08165314285714285}},"allowed":["618","618 W","428","819","823","821M"],"calcDefaults":["618 W","618","821M"],"colors":["0","1-2","3-4","5-8"],"prOptions":["Printed","Non PR"],"inputModes":["By Length","By Weight","By Imp"],"shipments":["Europe to Europe"],"designs":[1,2,3,4,5,6,7,8],"thicknessByLam":{"618":[51,56,61,66,78,86,106],"618 W":[51,56,61,66,78,86,106],"428":[79],"819":[121],"823":[121],"821M":[79]}};let mode=localStorage.getItem('b4p_mode')||'dark',activeCalc=1,states={1:{},2:{},3:{}},auth=sessionStorage.getItem('b4p_access')==='granted',deferredPrompt=null;function init(){[1,2,3].forEach((id,i)=>{const lam=DATA.calcDefaults[i];states[id]=Object.assign({},DATA.profiles[lam],{supplier:'Marma',shipment:'Europe to Europe'})})}init();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}function n(v,d=2){return v==null||v===''||Number.isNaN(Number(v))?'-':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}function i(v){return v==null||v===''||Number.isNaN(Number(v))?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:0})}function opt(a,v){return a.map(x=>`<option value="${x}" ${String(x)===String(v)?'selected':''}>${x}</option>`).join('')}function field(l,t,v,o,id){return `<div class="field"><label>${l}</label>${t==='select'?`<select id="${id}">${opt(o,v)}</select>`:`<input id="${id}" type="number" value="${v??''}">`}</div>`}function ro(l,v){return `<div class="field readonly"><label>${l}</label><div class="value">${v}</div></div>`}function title(id){return `Calculator ${id} - ${states[id].laminate} Laminate`}function colorFactor(cur,base){const r={'0':0.86,'1-2':0.94,'3-4':1,'5-8':1.08};return (r[cur]??1)/(r[base]??1)}function calc(c){const p=DATA.profiles[c.laminate];c.supplier='Marma';c.shipment='Europe to Europe';const bw=+p.widthAsked||1,w=+c.widthAsked||bw,bt=+p.totalThickness||1,t=+c.totalThickness||bt;let kgpm=(+p.kgPerMeter||0)*(w/bw)*(t/bt);const qty=+c.inputQuantity||0;let meters=0,kg=0,impL=+c.impLength||+p.impLength||0;if(c.inputMode==='By Weight'){kg=qty;meters=kg/Math.max(kgpm,.000001)}else if(c.inputMode==='By Imp'){const bq=+p.inputQuantity||qty||1;meters=(+p.lengthMeters||0)*(qty/bq);kg=meters*kgpm}else{meters=qty;kg=meters*kgpm}let factor=colorFactor(c.colors,p.colors);factor*=((c.prNonPr==='Printed'?1:.86)/(p.prNonPr==='Printed'?1:.86));factor*=((1+((+c.designs||1)-1)*.012)/(1+((+p.designs||1)-1)*.012));let sellKg=p.sellKgEur*factor;const extra=Math.max(0,Math.min(95,+c.additionalGrossProfit||0));sellKg=sellKg/(1-extra/100);const sellM=sellKg*kgpm;const sellImp=(c.inputMode==='By Imp'&&qty)?(sellKg*kg/qty):null,usd=1.16,b4p=(sellImp!==null&&impL)?((1000/impL)*sellImp*1000):sellM*1000;return{meters,kg,sellKg,sellKgUsd:sellKg*usd,sellM,sellMUsd:sellM*usd,sellImp,sellImpUsd:sellImp===null?null:sellImp*usd,b4p,totalSell:sellKg*kg}}function wire(id,fn){const e=document.getElementById(id);if(e)e.onchange=x=>{fn(x.target.value);render()}}function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginCard"><div class="loginLogo"><img src="image.png"></div><h1>B4PACK Pricing Calculator</h1><p>Enter password to continue.</p><input id="passwordInput" type="password" placeholder="Password"><button id="loginBtn">Unlock Calculator</button><div class="err" id="loginError"></div></div></div>`;document.getElementById('loginBtn').onclick=tryLogin;document.getElementById('passwordInput').onkeydown=e=>{if(e.key==='Enter')tryLogin()};document.getElementById('passwordInput').focus()}function tryLogin(){if(document.getElementById('passwordInput').value===DATA.password){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else document.getElementById('loginError').textContent='Incorrect password'}function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>deferredPrompt=null)}else alert('Use browser menu: Add to Home Screen / Install App.')}function render(){if(!auth){login();return}const c=states[activeCalc],r=calc(c),under=r.kg<(+c.kgMoq||500),th=DATA.thicknessByLam[c.laminate]||[c.totalThickness];document.getElementById('root').innerHTML=`<div class="app ${mode==='light'?'light':'dark'}"><header class="top"><div class="brand"><div class="logo"><img src="image.png"></div><div><h1>B4PACK Laminates Pricing</h1><div class="sub">Confidential internal pricing workspace</div></div></div><div class="actions"><button class="btn" id="modeBtn">${mode==='dark'?'Bright Mode':'Dark Mode'}</button><button class="btn" id="logoutBtn">Lock</button><div class="install"><img src="${DATA.qrUrl}"><div><button id="installBtn">Install</button><a href="${DATA.siteUrl}" target="_blank">Open</a></div></div></div></header><main class="page"><section class="notice"><strong>CONFIDENTIAL - INTERNAL USE ONLY</strong><p>This application contains proprietary pricing methodologies, cost structures, commercial calculations, and business-sensitive information. Unauthorized sharing is strictly prohibited.</p></section><section class="cards"><h2>Choose calculator</h2><div class="tabs">${[1,2,3].map(id=>`<button class="tab ${id===activeCalc?'active':''}" data-calc="${id}"><span>Calculator ${id}</span><strong>${states[id].laminate} Laminate</strong><small>${i(states[id].inputQuantity)} ${states[id].inputUnit||''}</small></button>`).join('')}</div></section><section class="work"><div class="main"><div class="title">${title(activeCalc)}</div><div class="wrap"><div class="group"><h3>Material setup</h3><div class="grid">${field('Laminate','select',c.laminate,DATA.allowed,'laminate')}${field('Total Thickness','select',c.totalThickness,th,'thickness')}${field('Width of Reel','number',c.widthAsked,null,'width')}</div></div><div class="group"><h3>Production inputs</h3><div class="grid">${field('Input Mode','select',c.inputMode,DATA.inputModes,'mode')}${field('Input Quantity','number',c.inputQuantity,null,'qty')}${field('PR / Non PR','select',c.prNonPr,DATA.prOptions,'pr')}${field('Colors','select',c.colors,DATA.colors,'colors')}${field('Designs','select',c.designs,DATA.designs,'designs')}${field('Shipment','select',c.shipment,DATA.shipments,'shipment')}${field('IMP Width','number',c.impWidth,null,'impw')}${field('IMP Length','number',c.impLength,null,'impl')}</div></div><div class="group"><h3>Calculated output</h3><div class="grid">${ro('Calculated Length',n(r.meters,0)+' m')}${ro('Calculated KG',n(r.kg,2)+' kg')}${ro('Total Sell EUR','€'+n(r.totalSell,2))}</div></div></div><div class="status"><div class="moq ${under?'bad':'good'}"><span>${under?'UNDER MOQ':'MOQ OK'}</span><span>${n(r.kg,2)} kg / MOQ ${n(c.kgMoq||500,0)} kg</span></div><div class="gp"><span>Additional Gross Profit %</span><input id="extraGp" type="number" value="${c.additionalGrossProfit??0}"></div></div></div><aside class="price"><div class="priceH">Final Price</div><div class="hero"><div class="k">Sell Price Per KG</div><div class="m">€${n(r.sellKg,2)}</div><div class="u">EUR / KG</div></div><div class="metrics"><div class="metric"><div class="l">KG USD</div><div class="v">$${n(r.sellKgUsd,2)}</div></div><div class="metric"><div class="l">Meter EUR</div><div class="v">€${n(r.sellM,4)}</div></div><div class="metric"><div class="l">Meter USD</div><div class="v">$${n(r.sellMUsd,4)}</div></div><div class="metric"><div class="l">IMP EUR</div><div class="v">${r.sellImp===null?'-':'€'+n(r.sellImp,5)}</div></div></div><div class="b4p"><div class="l">B4P per 1000 meter</div><div class="v">€${n(r.b4p,2)}</div></div></aside></section><section class="footer">CONFIDENTIAL - INTERNAL USE ONLY. Supplier is fixed internally as Marma and is not shown in the pricing interface.</section></main></div>`;document.getElementById('modeBtn').onclick=()=>{mode=mode==='dark'?'light':'dark';localStorage.setItem('b4p_mode',mode);render()};document.getElementById('installBtn').onclick=installApp;document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;login()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeCalc=+b.dataset.calc;render()});wire('laminate',v=>{states[activeCalc]=Object.assign({},DATA.profiles[v],{laminate:v,supplier:'Marma',shipment:'Europe to Europe'})});wire('thickness',v=>states[activeCalc].totalThickness=+v);wire('width',v=>states[activeCalc].widthAsked=+v);wire('pr',v=>states[activeCalc].prNonPr=v);wire('colors',v=>states[activeCalc].colors=v);wire('designs',v=>states[activeCalc].designs=+v);wire('mode',v=>states[activeCalc].inputMode=v);wire('qty',v=>states[activeCalc].inputQuantity=+v);wire('impw',v=>states[activeCalc].impWidth=+v);wire('impl',v=>states[activeCalc].impLength=+v);wire('extraGp',v=>states[activeCalc].additionalGrossProfit=+v)}render();</script></body></html>
